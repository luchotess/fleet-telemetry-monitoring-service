services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://fleet:fleet@postgres:5432/fleet
      JWT_SECRET: development-only-secret
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  simulator:
    build: ./simulator
    profiles: ["simulator"]
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  backend-tests:
    build: ./backend
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg2://fleet:fleet@postgres-test:5432/fleet_test
      TEST_DATABASE_URL: postgresql+psycopg2://fleet:fleet@postgres-test:5432/fleet_test
      JWT_SECRET: test-secret
    command: pytest
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres-data:
